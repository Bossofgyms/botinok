<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0f;
            min-height: 100vh;
            color: white;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .container { max-width: 100%; margin: 0 auto; position: relative; z-index: 1; padding: 15px 10px; }

        .header {
            text-align: center;
            margin-bottom: 15px;
            background: rgba(20, 20, 30, 0.7);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .header h1 { font-size: 20px; margin-bottom: 10px; }

        .question {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            word-wrap: break-word;
        }

        .counter-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }

        .counter {
            font-size: 14px;
            font-weight: bold;
            background: linear-gradient(135deg, #2F4F4F, #3A5A40);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .cards-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 15px;
        }

        .cards-container {
            display: flex;
            gap: 15px;
            padding: 10px;
            justify-content: center;
        }

        .card {
            width: 80px;
            height: 130px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s ease-in-out;
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.selected .card-inner { filter: brightness(1.2); }

        .card-front, .card-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            display: block !important;
        }

        .card-back {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            border: 3px solid #D2B48C;
            z-index: 1;
        }

        .card-front {
            background: #1a1a2e;
            border: 3px solid #D2B48C;
            transform: rotateY(180deg);
            z-index: 2;
            display: flex !important;
            flex-direction: column !important;
        }

        .card-image {
            width: 100%;
            height: 88%;
            object-fit: cover;
            object-position: center;
            display: block !important;
        }

        .card-info {
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.9));
            color: white;
            gap: 3px;
            border-radius: 0 0 10px 10px;
            height: 12%;
        }

        .card-name { font-size: 9px; font-weight: bold; text-align: center; line-height: 1.1; }
        .card-meaning { font-size: 6px; text-align: center; opacity: 0.8; }

        .card-placeholder {
            display: none !important;
            width: 100%;
            height: 88%;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: absolute;
            top: 0; left: 0;
        }

        .card-has-error .card-placeholder { display: flex !important; }
        .card-has-error .card-image { display: none !important; }

        .results-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            display: none;
        }

        .results-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; text-align: center; color: #ffd700; }
        .selected-cards { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

        .selected-card-item {
            background: linear-gradient(135deg, #2F4F4F, #3A5A40);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .actions { display: flex; gap: 10px; margin: 15px 0; }

        .submit-btn, .shuffle-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-transform: uppercase;
        }

        .submit-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #2F4F4F;
        }

        .submit-btn:disabled { background: #666; color: #aaa; cursor: not-allowed; }

        .shuffle-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .instructions { text-align: center; color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }

        @media (max-width: 375px) {
            .card { width: 70px; height: 110px; }
            .cards-container { gap: 12px; }
            .card-name { font-size: 8px; }
            .card-meaning { font-size: 5px; }
        }

        @media (min-width: 1024px) {
            .card { width: 90px; height: 140px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 Таро Расклад</h1>
            <div class="question"><strong>Вопрос:</strong> <span id="questionText">Загрузка...</span></div>
            <div class="counter-container">
                <div class="counter">Выбрано: <span id="selectedCount">0</span>/3 карт</div>
            </div>
        </div>
        <div class="cards-wrapper">
            <div id="cardsContainer" class="cards-container"></div>
        </div>
        <div id="resultsContainer" class="results-container">
            <div class="results-title">✨ Выбранные карты:</div>
            <div class="selected-cards" id="selectedCardsList"></div>
        </div>
        <div class="actions">
            <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
            <button id="submitBtn" class="submit-btn" disabled>📨 Отправить расклад</button>
        </div>
        <div class="instructions">
            💡 Нажми на карту — она перевернётся.<br>
            Выбери <b>3 карты из 5</b> для твоего расклада.
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
