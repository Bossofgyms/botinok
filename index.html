<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ваш полный стиль CSS -->
    <style>
        /* ... полностью вставьте ваш CSS из предыдущих сообщений ... */
        .card.selected { box-shadow: 0 0 12px rgba(255,215,0,0.8); }
        .cards-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; padding: 5px; justify-items: center; }
        body { font-family: sans-serif; background-color: #000; color: white; padding: 10px; min-height: 100vh; }
        button { padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Таро Расклад</h1>
            <div class="question"><strong>Вопрос:</strong> <span id="questionText">Загрузка...</span></div>
            <div class="counter">Выбрано: <span id="selectedCount">0</span>/3 карт</div>
        </div>

        <div id="cardsContainer" class="cards-container"></div>

        <div id="resultsContainer" class="results-container" style="display:none;">
            <div class="results-title">Выбранные карты:</div>
            <div class="selected-cards" id="selectedCardsList"></div>
        </div>

        <div class="actions">
            <button id="submitBtn" class="submit-btn" disabled>📨 Отправить расклад</button>
            <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать карты</button>
        </div>

        <div class="instructions">
            💡 Выберите 3 карты для расклада. Нажмите на карту, чтобы перевернуть и выбрать.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
