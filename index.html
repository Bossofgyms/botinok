<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таро Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .cards-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        /* === КАРТА === */
        .card {
            width: 100px;
            height: 160px;
            position: relative; /* ⚠️ КРИТИЧНО: для absolute children */
            cursor: pointer;
            perspective: 1000px;
        }
        .card-inner {
            position: relative; /* ⚠️ БЫЛО absolute — МЕНЯЕМ на relative! */
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #8B4513;
        }
        /* Рубашка */
        .card-back {
            background: #2a2a3e;
            font-size: 40px;
        }
        /* Лицо */
        .card-front {
            background: #1a1a2e;
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 5px;
        }
        .card-front img {
            width: 100%;
            height: 85%;
            object-fit: contain;
            border-radius: 5px;
        }
        .card-name {
            font-size: 10px;
            text-align: center;
            margin-top: 5px;
        }
        .counter { margin: 10px; font-size: 16px; }
        .btn {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: #ffd700;
            color: #2F4F4F;
        }
        .btn:disabled { background: #666; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>🔮 Тест переворота карт</h2>
    <div class="counter">Выбрано: <span id="count">0</span>/3</div>
    
    <div class="cards-container" id="container"></div>
    
    <button class="btn" id="shuffle">🔄 Перемешать</button>
    <button class="btn" id="submit" disabled>📨 Отправить</button>

    <script src="script.js"></script>
</body>
</html>
